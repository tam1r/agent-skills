name: Dependabot auto-merge

# Approves Dependabot PRs and turns on auto-merge, so GitHub merges them once the
# required checks pass. Tailwind major upgrades stay manual.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Both checks: skip when someone else pushed onto a Dependabot branch.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge
        if: ${{ !(contains(steps.metadata.outputs.dependency-names, 'tailwindcss') && steps.metadata.outputs.update-type == 'version-update:semver-major') }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
